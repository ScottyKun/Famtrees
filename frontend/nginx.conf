# Sert l'application React (SPA). Les en-têtes de sécurité (CSP, HSTS…) et le
# routage /spring, /flask sont gérés par Traefik (compose.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fichiers de build avec empreinte dans le nom : cache long, immuable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Toutes les routes du front (/arbres/123, /login…) renvoient index.html,
    # jamais mis en cache pour qu'un nouveau déploiement soit pris tout de suite.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
