spring.application.name=backend

spring.config.import=optional:file:.env[.properties]

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.data.neo4j.database=${NEO4J_DATABASE:neo4j}

server.port=${SERVER_PORT:8070}

famtrees.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
famtrees.jwt.issuer=famtrees
famtrees.jwt.cookie-name=famtrees_token

famtrees.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
