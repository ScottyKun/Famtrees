name: famtrees

services:

  # ── Bases de données
  postgres:
    image: postgres:16-alpine
    container_name: famtrees_postgres
    restart: unless-stopped
    env_file: deploy/env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  neo4j:
    image: neo4j:5.26-community
    container_name: famtrees_neo4j
    restart: unless-stopped
    env_file: deploy/env/neo4j.env
    environment:
      # Pas d'interface web (Neo4j Browser) : seul le protocole Bolt reste actif
      NEO4J_server_http_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  # ── API Spring 
  spring:
    build: ./backend-spring/backend
    image: famtrees-spring:latest
    container_name: famtrees_spring
    restart: unless-stopped
    env_file: deploy/env/spring.env
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - internal
      - traefik-public
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.famtrees-spring.rule=Host(`${SITE_HOST:-genealogie.famproject.cloud}`) && PathPrefix(`/spring/`)"
      - "traefik.http.routers.famtrees-spring.entrypoints=websecure"
      - "traefik.http.routers.famtrees-spring.tls.certresolver=leresolver"
      - "traefik.http.routers.famtrees-spring.middlewares=famtrees-spring-strip,famtrees-spring-headers,famtrees-spring-ratelimit"
      - "traefik.http.services.famtrees-spring.loadbalancer.server.port=8070"
      - "traefik.http.middlewares.famtrees-spring-strip.stripprefix.prefixes=/spring"
      - "traefik.http.middlewares.famtrees-spring-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.famtrees-spring-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.famtrees-spring-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.famtrees-spring-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.famtrees-spring-ratelimit.ratelimit.burst=100"

  # ── API Flask 
  flask:
    build: ./tree-flask
    image: famtrees-flask:latest
    container_name: famtrees_flask
    restart: unless-stopped
    env_file: deploy/env/flask.env
    depends_on:
      postgres:
        condition: service_healthy
      spring:
        condition: service_started
    networks:
      - internal
      - traefik-public
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.famtrees-flask.loadbalancer.server.port=5000"
      - "traefik.http.middlewares.famtrees-flask-strip.stripprefix.prefixes=/flask"
      - "traefik.http.middlewares.famtrees-flask-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.famtrees-flask-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.famtrees-flask-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.famtrees-flask-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.famtrees-flask-ratelimit.ratelimit.burst=100"
      # API Flask
      - "traefik.http.routers.famtrees-flask.rule=Host(`${SITE_HOST:-genealogie.famproject.cloud}`) && PathPrefix(`/flask/`)"
      - "traefik.http.routers.famtrees-flask.entrypoints=websecure"
      - "traefik.http.routers.famtrees-flask.tls.certresolver=leresolver"
      - "traefik.http.routers.famtrees-flask.service=famtrees-flask"
      - "traefik.http.routers.famtrees-flask.middlewares=famtrees-flask-strip,famtrees-flask-headers,famtrees-flask-ratelimit"
      # Connexion / inscription : limite bien plus stricte (anti force brute)
      - "traefik.http.routers.famtrees-flask-auth.rule=Host(`${SITE_HOST:-genealogie.famproject.cloud}`) && (Path(`/flask/api/auth/login`) || Path(`/flask/api/auth/register`))"
      - "traefik.http.routers.famtrees-flask-auth.priority=1000"
      - "traefik.http.routers.famtrees-flask-auth.entrypoints=websecure"
      - "traefik.http.routers.famtrees-flask-auth.tls.certresolver=leresolver"
      - "traefik.http.routers.famtrees-flask-auth.service=famtrees-flask"
      - "traefik.http.routers.famtrees-flask-auth.middlewares=famtrees-flask-strip,famtrees-flask-headers,famtrees-flask-auth-ratelimit"
      - "traefik.http.middlewares.famtrees-flask-auth-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.famtrees-flask-auth-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.famtrees-flask-auth-ratelimit.ratelimit.burst=10"

  # ── Front (nginx) 
  frontend:
    build: ./frontend
    image: famtrees-frontend:latest
    container_name: famtrees_frontend
    restart: unless-stopped
    networks:
      - traefik-public
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.famtrees-front.rule=Host(`${SITE_HOST:-genealogie.famproject.cloud}`)"
      - "traefik.http.routers.famtrees-front.entrypoints=websecure"
      - "traefik.http.routers.famtrees-front.tls.certresolver=leresolver"
      - "traefik.http.routers.famtrees-front.middlewares=famtrees-front-headers,famtrees-front-ratelimit"
      - "traefik.http.services.famtrees-front.loadbalancer.server.port=8080"
      # En-têtes de sécurité
      - "traefik.http.middlewares.famtrees-front-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.famtrees-front-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.famtrees-front-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.famtrees-front-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.famtrees-front-headers.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - "traefik.http.middlewares.famtrees-front-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.famtrees-front-headers.headers.customResponseHeaders.Server="
      # CSP : aucun script externe ni inline ; les API sont sur le même domaine (connect-src 'self').
      # style-src-attr 'unsafe-inline' : styles posés par React / React Flow sur les éléments.
      - "traefik.http.middlewares.famtrees-front-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
      - "traefik.http.middlewares.famtrees-front-ratelimit.ratelimit.average=30"
      - "traefik.http.middlewares.famtrees-front-ratelimit.ratelimit.burst=60"

networks:
  # Réseau privé des bases
  internal:
    internal: true
  traefik-public:
    external: true

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
